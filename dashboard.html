<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Dashboard Alumna</h1>
  </header>

  <main class="dashboard-container">

    <section class="card">
      <h2>Perfil</h2>

      <div id="profileData"></div>
    </section>

    <section class="card">
      <h2>Subir práctica</h2>

      <form id="practiceForm">

        <input
          type="url"
          id="videoLink"
          placeholder="Pegá el link del video"
          required
        >

        <textarea
          id="practiceNotes"
          placeholder="Comentarios de la práctica"
        ></textarea>

        <button type="submit" class="btn">
          Guardar práctica
        </button>

      </form>
    </section>

    <section class="card">
      <h2>Prácticas subidas</h2>

      <div id="practiceList"></div>
    </section>

  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
